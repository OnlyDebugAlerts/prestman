[package]
name = "prestman"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[dependencies]
anyhow = "1"
directories = "6"
form_urlencoded = "1"
gpui-kit = { version = "=0.10.0", features = ["tree-sitter"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2", "charset", "gzip", "brotli", "zstd", "deflate", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
