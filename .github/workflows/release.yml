name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            package: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            package: macos-x64
            target: x86_64-apple-darwin
          - os: macos-15
            package: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-2022
            package: windows-x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            package: windows-arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: ${{ matrix.package }}
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build release executable
        run: |
          rustc -vV
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --bin prestman --target ${{ matrix.target }}

      - name: Package macOS or Linux binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/prestman-$PACKAGE.tar.gz" \
            -C "target/$RUST_TARGET/release" prestman

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/$env:RUST_TARGET/release/prestman.exe" `
            -DestinationPath "dist/prestman-$env:PACKAGE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: prestman-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --generate-notes
